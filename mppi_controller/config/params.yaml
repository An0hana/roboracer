mppi_controller:
  ros__parameters:
    # Simulation and vehicle deployment both require CUDA. Configuration fails
    # instead of silently falling back when the backend is unavailable.
    backend: cuda
    odom_topic: /state_estimation/odom
    costmap_topic: /perception/local_costmap
    command_topic: /control/mppi_cmd
    path_topic: /control/mppi_path
    raceline_path_topic: /debug/raceline
    diagnostics_topic: /diagnostics
    map_frame: map
    base_frame: base_link
    race_line_file: ""
    control_frequency: 30.0
    state_timeout: 0.10
    costmap_timeout: 0.10
    # The scan costmap remains available at 40 Hz; distance transform and CUDA
    # upload only needs to match the 30 Hz controller.
    costmap_processing_frequency: 30.0
    # Four control periods tolerate occasional non-real-time Linux/RViz
    # scheduling jitter. Sensor freshness watchdogs remain at 0.10 s.
    output_timeout: 0.20
    tf_timeout: 0.02
    max_solve_time_ms: 25.0
    localization_position_jump_threshold: 0.50
    localization_yaw_jump_threshold: 0.70
    localization_jump_hold_time: 0.50
    # Keep a separate hard measurement envelope above the desired command cap.
    # A smaller overspeed enters the controlled recovery below; only a gross
    # excursion beyond this tolerance remains a fail-safe stop.
    measured_speed_tolerance: 0.50
    require_costmap: true
    occupied_threshold: 50
    unknown_is_occupied: false
    # Tracked opponents enter every rollout step as constant-velocity
    # extrapolations. Stale data degrades to costmap-only avoidance (WARN),
    # never to a stop: an empty track legitimately publishes nothing.
    obstacles_topic: /perception/obstacles
    obstacles_timeout: 0.20
    max_obstacle_count: 8
    min_obstacle_confidence: 0.25
    race_state_topic: /state_machine/state
    race_state_timeout: 0.15
    # Standalone MPPI validation remains possible. The adaptive stack launch
    # overrides this to true and then the safety layer is authoritative.
    require_race_state: false

    mppi:
      rollout_count: 2048
      # Preserve the original 2.4 s horizon while reducing receding-horizon
      # scheduling latency from 50 ms to 33 ms.
      horizon_steps: 72
      dt: 0.03333333333333333
      lambda: 1.0
      steering_rate_stddev: 0.5
      acceleration_stddev: 0.8
      pure_noise_fraction: 0.05
      near_obstacle_distance: 0.50
      near_obstacle_exploration_scale: 1.50
      random_seed: 7
      nearest_search_radius: 80
      cbf_gamma: 0.35
      max_lateral_acceleration: 6.0
      minimum_preview_distance: 4.0
      maximum_heading_error: 1.20
      reverse_progress_tolerance: 0.05
      repair_steps: 4
      repair_iterations: 2
      repair_budget_ms: 3.0
      # Preferred CBF clearance outside vehicle.safety_margin. This is a soft
      # optimization buffer; safety_margin remains the hard collision limit.
      repair_clearance: 0.05
      # A 5 cm local grid can put the measured pose a few millimetres inside
      # the 5 cm safety envelope. Allow a moderate initial envelope violation
      # and require the full margin to be restored within the recovery window.
      # Physical footprint overlap is never accepted and AEB remains independent.
      initial_clearance_tolerance: 0.030
      clearance_recovery_steps: 18
      clearance_recovery_speed_threshold: 1.50
      clearance_recovery_acceleration_speed_threshold: 0.10

    recovery:
      # Preserve MPPI steering while lowering only the velocity setpoint when
      # measured speed exceeds the desired cap. Entry and exit margins provide
      # hysteresis, avoiding the old max_speed+tolerance -> zero-speed cycle.
      overspeed_entry_margin: 0.10
      overspeed_exit_margin: 0.03
      overspeed_exit_hold_time: 0.20
      overspeed_command_reduction: 0.10
      overspeed_proportional_gain: 0.50
      overspeed_command_deceleration: 1.50
      # Escape a braking-only CUDA warm-start local minimum only when the car
      # is safe, obstacle-free and odometry confirms it is nearly stationary.
      stuck_speed_threshold: 0.05
      stuck_speed_scale_threshold: 0.25
      stuck_minimum_clearance: 0.05
      stuck_timeout: 1.50
      stuck_cooldown: 2.00

    cuda:
      # Preallocated once during lifecycle configure (4M float cells = 16 MiB).
      max_map_cells: 4194304

    vehicle:
      wheelbase: 0.324
      length: 0.552
      rear_overhang: 0.124
      width: 0.320
      safety_margin: 0.05
      min_steering: -0.32
      max_steering: 0.32
      min_steering_rate: -1.5
      max_steering_rate: 1.5
      # The command target may move quickly, but the effective curvature state
      # follows the measured actuator/tyre response. full_lap_stop_go_02 showed
      # about 0.18-0.19 s phase lag at 2 m/s and only 0.55-0.72 rad/s effective
      # steering slew for the upper 90-95 percentiles.
      steering_response_time: 0.15
      min_effective_steering_rate: -1.20
      max_effective_steering_rate: 1.20
      effective_steering_rate_speed_coefficient: 0.18
      steering_effectiveness_at_zero_speed: 1.0
      steering_effectiveness_speed_squared: 0.05
      minimum_steering_effectiveness: 0.70
      min_acceleration: -1.5
      max_acceleration: 1.0
      min_speed: 0.0
      max_speed: 2.0

    steering_estimator:
      # Above this speed, correct the actuator prediction with effective
      # steering atan(wheelbase*yaw_rate/speed). At lower speed curvature is
      # poorly observable, so retain the bounded actuator prediction.
      minimum_observation_speed: 0.50
      observation_gain: 0.60

    weights:
      lateral: 12.0
      heading: 8.0
      lag: 1.0
      # Prevent the sampler from settling into the zero-speed local minimum
      # when starting from rest.
      speed: 50.0
      progress: 8.0
      control: 0.15
      control_change: 0.4
      lateral_acceleration: 0.25
      # The CSV widths are only prior geometry and can disagree with the
      # deformed physical track. Live costmap CBF/collision and the independent
      # AEB remain authoritative; lateral/heading terms still pull toward the
      # race line without forcing a safe off-line vehicle to stop.
      boundary: 0.0
      cbf: 400.0
      collision: 1000000.0
      terminal_lateral: 80.0
      terminal_heading: 60.0
      terminal_progress: 120.0
