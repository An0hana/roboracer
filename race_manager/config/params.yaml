race_manager:
  ros__parameters:
    obstacles_topic: /perception/obstacles
    odom_topic: /state_estimation/odom
    trajectory_topic: /planner/local_trajectory
    output_topic: /race_manager/state
    marker_topic: /race_manager/state_marker
    publish_rate_hz: 20.0
    target_frame: map
    state_timeout: 0.10
    obstacle_timeout: 0.15
    trajectory_timeout: 0.15
    minimum_obstacle_confidence: 0.05

    follow_distance: 4.0
    opponent_corridor_half_width: 0.80
    pass_margin: 0.30
    overtake_lateral_threshold: 0.08
    return_lateral_threshold: 0.05

    transition_confirmation: 0.20
    minimum_state_duration: 0.40
    recovery_confirmation: 0.50
    opponent_lost_timeout: 0.50

    cruise_speed_scale: 1.0
    trailing_speed_scale: 0.60
    overtake_speed_scale: 1.0
    return_speed_scale: 0.80
