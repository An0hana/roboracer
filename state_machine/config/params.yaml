state_machine:
  ros__parameters:
    obstacles_topic: /perception/obstacles
    odom_topic: /ego_racecar/odom
    costmap_topic: /perception/local_costmap
    diagnostics_topic: /diagnostics
    output_topic: /state_machine/state
    marker_topic: /state_machine/state_marker
    race_line_file: ""
    publish_rate_hz: 20.0
    target_frame: map
    state_timeout: 0.10
    obstacle_timeout: 0.20
    costmap_timeout: 0.12
    minimum_obstacle_confidence: 0.25
    occupied_threshold: 50

    # Continuous confidence in the pre-built track geometry.  Fast decay
    # reacts to a moved wall; slow recovery prevents mode chattering.
    boundary_match_tolerance: 0.30
    confidence_preview_distance: 6.0
    minimum_confidence_samples: 8
    confidence_rise_time: 1.50
    confidence_fall_time: 0.35

    # Start behavior arbitration before MPPI's collision cost dominates.
    # Trigger distance = follow_distance + closing_speed * follow_time_headway.
    follow_distance: 4.0
    follow_time_headway: 1.5
    maximum_follow_distance: 12.0
    opponent_corridor_half_width: 0.80
    pass_margin: 0.30
    corridor_clearance_radius: 0.24
    emergency_stop_distance: 0.55
    overtake_lateral_offset: 0.45
    allow_direct_overtake: true

    transition_confirmation: 0.20
    minimum_state_duration: 0.40
    recovery_confirmation: 0.50
    opponent_lost_timeout: 0.50
    return_blend_duration: 1.50

    cruise_speed_scale: 1.0
    trailing_speed_scale: 0.60
    overtake_speed_scale: 1.0
    degraded_speed_scale: 0.55
    minimum_raceline_weight_scale: 0.25
    maximum_safety_weight_scale: 2.0

    # Reverse recovery combines fresh planner/AEB failure evidence with low
    # measured progress and either a tight raceline turn or saturated steering.
    diagnostics_timeout: 0.5
    stuck_speed_threshold: 0.08
    recovery_entry_time: 0.75
    failure_evidence_hold_time: 1.0
    # The default raceline peaks near 0.215 rad equivalent steering. These
    # thresholds identify its genuinely tight sections without pretending the
    # centerline itself exceeds the mechanical steering stop.
    tight_curve_steering_threshold: 0.18
    tight_curve_exit_threshold: 0.14
    steering_saturation_fraction: 0.85
    # Signed steering envelope, shared by launch with MPPI and safety.
    min_steering: -0.404
    max_steering: 0.381
    # Signed curvature is averaged over ± this many ~0.1 m raceline points.
    curvature_window_points: 5
    wheelbase: 0.324

    # Phased maneuver: settle steering at zero speed, reverse slowly with the
    # wheels opposite the bend, then command zero until odometry confirms stop.
    recovery_settle_time: 0.30
    reverse_speed: 0.30
    reverse_steer_sign: -1.0
    reverse_steer_fraction: 0.90

    # Reverse exit gate. Forward motion never contributes to these distances.
    recovery_min_reverse_distance: 0.3
    recovery_target_reverse_distance: 0.6
    reverse_max_duration: 6.0
    reverse_max_distance: 1.8
    recovery_stop_speed_threshold: 0.05
    recovery_stop_hold_time: 0.30
    reentry_debounce: 4.0
