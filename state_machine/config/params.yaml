state_machine:
  ros__parameters:
    obstacles_topic: /perception/obstacles
    odom_topic: /ego_racecar/odom
    costmap_topic: /perception/local_costmap
    diagnostics_topic: /diagnostics
    output_topic: /state_machine/state
    marker_topic: /state_machine/state_marker
    race_line_file: ""
    publish_rate_hz: 20.0
    target_frame: map
    state_timeout: 0.10
    obstacle_timeout: 0.20
    costmap_timeout: 0.12
    minimum_obstacle_confidence: 0.25
    occupied_threshold: 50

    # Continuous confidence in the pre-built track geometry.  Fast decay
    # reacts to a moved wall; slow recovery prevents mode chattering.
    boundary_match_tolerance: 0.30
    confidence_preview_distance: 6.0
    minimum_confidence_samples: 8
    confidence_rise_time: 1.50
    confidence_fall_time: 0.35

    # Start behavior arbitration before MPPI's collision cost dominates.
    # Trigger distance = follow_distance + closing_speed * follow_time_headway.
    follow_distance: 4.0
    follow_time_headway: 1.5
    maximum_follow_distance: 12.0
    opponent_corridor_half_width: 0.80
    pass_margin: 0.30
    corridor_clearance_radius: 0.24
    emergency_stop_distance: 0.55
    overtake_lateral_offset: 0.45
    allow_direct_overtake: true

    transition_confirmation: 0.20
    minimum_state_duration: 0.40
    recovery_confirmation: 0.50
    opponent_lost_timeout: 0.50
    return_blend_duration: 1.50

    cruise_speed_scale: 1.0
    trailing_speed_scale: 0.60
    overtake_speed_scale: 1.0
    degraded_speed_scale: 0.55
    minimum_raceline_weight_scale: 0.25
    maximum_safety_weight_scale: 2.0

    # Reverse-recovery: /diagnostics (MPPI + safety) is consumed to know when
    # the planner is failing / AEB is latched. The car is "stuck" when it is
    # stationary while the raceline demands more steering than max_steering.
    diagnostics_timeout: 0.5
    stuck_speed_threshold: 0.05
    recovery_entry_time: 1.5
    curvature_fraction: 0.97
    # Curvature is averaged over a closed-loop window of ± this many raceline
    # points around the nearest point (~0.1 m spacing => ±5 ≈ ±0.5 m), so the
    # stuck gate judges the whole turn segment. Keep in sync with MPPI's
    # creep.curvature_window_points.
    curvature_window_points: 5
    max_steering: 0.32
    wheelbase: 0.324

    # Reverse command (safety layer executes it directly).
    reverse_speed: 0.6
    # -1.0 = wheels opposite the curve (per original spec).  Maps where the
    # narrow side is outside the curve should flip to +1.0.
    reverse_steer_sign: -1.0
    reverse_steer_fraction: 0.0

    # Recovery exit gate.
    recovery_min_reverse_distance: 0.3
    reverse_max_duration: 6.0
    reverse_max_distance: 1.8
    exit_clear_time: 1.0
    reentry_debounce: 4.0
