local_costmap:
  ros__parameters:
    scan_topic: /scan
    odom_topic: /state_estimation/odom
    costmap_topic: /perception/local_costmap
    map_frame: map
    base_frame: base_link
    # A map-aligned square safely contains the complete 9.6 m prediction
    # arc produced by the 2.4 s MPPI horizon at 4 m/s.
    size_x: 22.0
    size_y: 22.0
    resolution: 0.05
    obstacle_persistence: 0.20
    forward_offset: 0.0
    align_with_vehicle: false
    odom_timeout: 0.10
    tf_timeout: 0.02
    max_range: 30.0
    wall_connection_max_gap: 0.20
    wall_connection_spacing: 0.025
    # Match the safety-controller vehicle self-return mask. Coordinates are
    # expressed in base_link; normal obstacles outside the vehicle remain.
    self_filter_enabled: true
    self_filter_min_x: 0.05
    self_filter_max_x: 0.35
    self_filter_min_y: -0.22
    self_filter_max_y: 0.22
