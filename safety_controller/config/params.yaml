safety_controller:
  ros__parameters:
    # All topics can be overridden by launch arguments. Only this node publishes
    # the final vehicle command.
    scan_topic: "/scan"
    odom_topic: "/state_estimation/odom"
    mppi_cmd_topic: "/control/mppi_cmd"
    ftg_cmd_topic: "/control/ftg_cmd"
    output_topic: "/ackermann_cmd"
    diagnostics_topic: "/diagnostics"
    output_frame: "base_link"
    controller_mode: "mppi"
    publish_rate_hz: 50.0

    # A mode change is rejected unless the state is fresh and speed is below
    # this threshold. A fault never causes an automatic controller switch.
    switch_speed_threshold: 0.20
    # During a stop, retain a bounded measured steering angle while moving,
    # then center at near-zero speed to prevent a stale curved AEB sweep from
    # locking the steering against an obstacle.
    stop_steering_center_speed: 0.050
    state_timeout: 0.100
    scan_timeout: 0.150
    command_timeout: 0.100
    min_command_speed: 0.0
    max_command_speed: 2.0
    min_command_steering: -0.20
    max_command_steering: 0.20

    # Measured vehicle geometry, expressed relative to the rear axle.
    wheelbase: 0.324
    vehicle_length: 0.552
    vehicle_width: 0.320
    rear_overhang: 0.124
    footprint_margin: 0.050
    lidar_offset_x: 0.250
    lidar_offset_y: 0.0
    # The real scanner sees two fixed parts of its body/protective mount.
    # Bounds are in base_link and were measured from a stationary open-area
    # rosbag. They remain inside the vehicle's present-time AEB footprint.
    self_filter_enabled: true
    self_filter_min_x: 0.05
    self_filter_max_x: 0.35
    self_filter_min_y: -0.22
    self_filter_max_y: 0.22
    steering_estimation_min_speed: 0.050
    max_state_steering_angle: 0.60

    # Swept-rectangle AEB distance = reaction*v + v^2/(2*decel) + extra.
    aeb_reaction_time: 0.100
    aeb_max_deceleration: 3.0
    aeb_extra_distance: 0.150
    aeb_max_sweep_distance: 3.0
    aeb_sweep_step: 0.050
    scan_min_valid_fraction: 0.50
