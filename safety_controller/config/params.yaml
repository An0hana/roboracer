safety_controller:
  ros__parameters:
    # All topics can be overridden by launch arguments. Only this node publishes
    # the final vehicle command.
    scan_topic: "/scan"
    odom_topic: "/state_estimation/odom"
    mppi_cmd_topic: "/control/mppi_cmd"
    ftg_cmd_topic: "/control/ftg_cmd"
    race_state_topic: "/state_machine/state"
    output_topic: "/ackermann_cmd"
    diagnostics_topic: "/diagnostics"
    output_frame: "base_link"
    controller_mode: "mppi"
    publish_rate_hz: 50.0

    # A mode change is rejected unless the state is fresh and speed is below
    # this threshold. A fault never causes an automatic controller switch.
    switch_speed_threshold: 0.20
    # Non-AEB faults retain measured steering while moving and center only
    # near zero speed. AEB uses the separate steering-only recovery below.
    stop_steering_center_speed: 0.050
    state_timeout: 0.100
    scan_timeout: 0.150
    command_timeout: 0.100
    min_command_speed: 0.0
    max_command_speed: 2.0
    # Negative speed is accepted only while a fresh RaceState explicitly
    # reports RECOVERY/REVERSE. Normal MPPI and all FTG commands remain >= 0.
    # Must cover MPPI's -0.40 m/s straight recovery command with a small
    # float/measurement margin. Reverse remains authorized only by a fresh
    # RECOVERY/REVERSE RaceState.
    recovery_min_command_speed: -0.45
    recovery_state_timeout: 0.150
    min_command_steering: -0.40
    max_command_steering: 0.38
    steering_response_time: 0.150
    min_effective_steering_rate: -1.20
    max_effective_steering_rate: 1.20
    effective_steering_rate_speed_coefficient: 0.18
    steering_effectiveness_at_zero_speed: 1.0
    steering_effectiveness_speed_squared: 0.05
    minimum_steering_effectiveness: 0.70

    # Measured vehicle geometry, expressed relative to the rear axle.
    wheelbase: 0.324
    vehicle_length: 0.552
    vehicle_width: 0.320
    rear_overhang: 0.124
    footprint_margin: 0.050
    # Ignore points that only graze the inflated lateral footprint. AEB is
    # raised after a point penetrates this far inward from that outer edge.
    aeb_lateral_intrusion_threshold: 0.050
    lidar_offset_x: 0.250
    lidar_offset_y: 0.0
    # The real scanner sees two fixed parts of its body/protective mount.
    # Bounds are in base_link and were measured from a stationary open-area
    # rosbag. They remain inside the vehicle's present-time AEB footprint.
    self_filter_enabled: true
    self_filter_min_x: 0.05
    self_filter_max_x: 0.35
    self_filter_min_y: -0.22
    self_filter_max_y: 0.22
    # Below 0.5 m/s, atan(wheelbase*yaw_rate/speed) is noise dominated.
    # Retain the bounded actuator prediction instead.
    steering_estimation_min_speed: 0.500
    max_state_steering_angle: 0.60

    # Swept-rectangle AEB distance = reaction*v + v^2/(2*decel) + extra.
    aeb_reaction_time: 0.050
    aeb_max_deceleration: 3.0
    aeb_extra_distance: 0.050
    aeb_max_sweep_distance: 3.0
    aeb_sweep_step: 0.050
    aeb_clear_hold_time: 0.200
    aeb_release_extra_distance: 0.0
    aeb_release_check_speed: 1.500
    aeb_max_latch_duration: 1.5
    aeb_debounce_duration: 0.50
    aeb_resume_acceleration: 1.000
    # Keep propulsion at zero while allowing a bounded steering-only recovery
    # after the vehicle has slowed below 0.10 m/s. AEB releases only after the
    # recovery target is reached and its swept path is clear for the normal
    # 0.20 s hold time.
    aeb_steering_recovery_enabled: true
    aeb_steering_recovery_max_speed: 0.100
    # The controller updates its steering command at 30 Hz; at 0.8 rad/s the
    # recovery lag is ~0.2 s.  A tighter tolerance than the command step size
    # prevents convergence in practice because the target moves faster than
    # the recovery can track.
    aeb_steering_recovery_rate: 1.200
    aeb_steering_recovery_tolerance: 0.050
    scan_min_valid_fraction: 0.50
