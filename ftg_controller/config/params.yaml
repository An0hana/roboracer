ftg_node:
  ros__parameters:
    # Hardware I/O. The controller uses LaserScan as its only sensor input.
    scan_topic: "/scan"
    drive_topic: "/ackermann_cmd"

    # Laser preprocessing and free-space extraction.
    field_of_view_deg: 180.0
    max_lidar_range: 10.0
    min_lidar_range: 0.05
    smoothing_window: 5
    disparity_threshold: 0.40
    safety_radius: 0.35
    min_clearance: 0.45
    min_gap_width: 0.65
    best_point_window: 9

    # Candidate generation and target scoring.
    candidate_count: 21
    depth_weight: 0.35
    heading_weight: 0.25
    gap_center_weight: 0.65
    path_clearance_weight: 0.75
    path_margin_weight: 1.0
    continuity_weight: 0.5
    gap_switch_hysteresis: 0.10

    # Vehicle geometry and swept-path evaluation.
    wheelbase: 0.324
    lidar_offset: 0.250
    min_lookahead: 0.8
    max_lookahead: 2.0
    path_sweep_radius: 0.35
    path_horizon: 3.0

    # Steering and speed control.
    nominal_scan_period: 0.004
    steering_time_constant: 0.12
    max_steering_angle: 0.32
    max_steering_rate: 2.0
    max_speed: 1.0
    emergency_distance: 0.45
    max_lateral_accel: 4.0
    max_accel: 2.0
    max_decel: 3.0
    max_jerk: 15.0
