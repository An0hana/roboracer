ekf_filter_node:
  ros__parameters:
    frequency: 100.0
    sensor_timeout: 0.10
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # Only fuse the measured longitudinal wheel speed. Do not fuse the VESC
    # steering-command-derived yaw rate as if it were an independent sensor.
    odom0: /vesc/odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, false,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 20

    # Magnetometer yaw is intentionally excluded for indoor racing. The gyro
    # z rate supplies short-term heading dynamics while AMCL bounds drift.
    imu0: /imu/data
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: true
    imu0_remove_gravitational_acceleration: true
    imu0_queue_size: 50

amcl:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_link
    global_frame_id: map
    odom_frame_id: odom
    scan_topic: scan
    tf_broadcast: true
    transform_tolerance: 0.05
    min_particles: 500
    max_particles: 2500
    max_beams: 120
    laser_model_type: likelihood_field
    laser_likelihood_max_dist: 1.5
    laser_max_range: 10.0
    laser_min_range: 0.05
    update_min_a: 0.02
    update_min_d: 0.02
    resample_interval: 1
    pf_err: 0.02
    pf_z: 0.99
    recovery_alpha_fast: 0.1
    recovery_alpha_slow: 0.001
    set_initial_pose: false

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""

localization_lifecycle_manager:
  ros__parameters:
    autostart: true
    node_names: [map_server, amcl]
