race_bringup:
  # F1TENTH Gym publishes the map and wall-clock-stamped sensor messages.
  mode: sim
  controller_mode: mppi
  scan_topic: /scan
  state_topic: /ego_racecar/odom
  final_drive_topic: /drive
  raceline: /workspace/Spielberg_raceline.csv
  map: ""
  map_topic: /map
  require_map: true
  max_speed: 3.0
  min_steering: -0.20
  max_steering: 0.20
  use_sim_time: false
  use_localization: false
  use_ekf: false
  use_direct_vesc_adapter: false
  velocity_odom_topic: ""
