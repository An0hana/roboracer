vesc_driver_node:
  ros__parameters:
    port: /dev/aesc
    brake_max: 200000.0
    brake_min: -20000.0
    current_max: 100.0
    current_min: 0.0
    duty_cycle_max: 0.3
    duty_cycle_min: -0.3
    position_max: 0.0
    position_min: 0.0
    servo_max: 0.15
    servo_min: 0.85
    speed_max: 23250.0
    speed_min: -23250.0

ackermann_to_vesc_node:
  ros__parameters:
    speed_to_erpm_gain: 4614.0
    speed_to_erpm_offset: 0.0
    # Stock vesc_ackermann supports one steering gain. Keep this node behind
    # race_safety's optional piecewise adapter, or extend the source-built
    # node before enabling direct physical-angle commands.
    steering_angle_to_servo_gain: -1.2135
    steering_angle_to_servo_offset: 0.50

vesc_to_odom_node:
  ros__parameters:
    odom_frame: odom
    base_frame: base_link
    speed_to_erpm_gain: 4614.0
    speed_to_erpm_offset: 0.0
    use_servo_cmd_to_calc_angular_velocity: true
    steering_angle_to_servo_gain: -1.2135
    steering_angle_to_servo_offset: 0.50
    wheelbase: 0.324
    publish_tf: false

vesc_piecewise_adapter:
  ros__parameters:
    speed_to_erpm_gain: 4614.0
    speed_to_erpm_offset: 0.0
    servo_center: 0.50
    left_servo_per_rad: -1.13
    right_servo_per_rad: -1.52
    servo_min: 0.15
    servo_max: 0.85
